[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
arrow = "59"
arrow-array = { version = "59" }
arrow-flight = { version = "59", features = ["flight-sql-experimental"] }
arrow-schema = { version = "59" }
arrow-select = { version = "59" }
async-trait = { version = "^0.1.89" }
bytes = { version = "1" }
# The Cedar/policy crates live in the breakwater sibling repo
# (open-lakehouse/breakwater), published to crates.io. Consumers import them as
# `cedar_oci` / `datafusion_policy_cedar` (names unchanged from the in-tree crates).
# `datafusion-policy` is the neutral (engine-agnostic) core: it owns the
# secured-view provider seam (`govern_provider_from_config`) hydrofoil wraps
# UC-resolved tables with, imported as `datafusion_policy`.
#
# Pinned to breakwater `main` (the DataFusion 55 bump, #15) until that release
# reaches the crates.io mirror we build against; then drop `git`/`rev` and keep
# the `version`.
cedar-oci = { package = "olai-cedar-oci", version = "0.0.2", git = "https://github.com/open-lakehouse/breakwater", rev = "f1686e0871e2d3d7fe34fe1cba25605f80790f89" }
datafusion-policy = { package = "olai-datafusion-policy", version = "0.0.3", git = "https://github.com/open-lakehouse/breakwater", rev = "f1686e0871e2d3d7fe34fe1cba25605f80790f89" }
datafusion-policy-cedar = { package = "olai-datafusion-policy-cedar", version = "0.0.3", git = "https://github.com/open-lakehouse/breakwater", rev = "f1686e0871e2d3d7fe34fe1cba25605f80790f89" }
chrono = { version = "0.4.44", features = ["serde"] }
config = "0.15.19"
dashmap = "6.0.1"
datafusion = "55"
datafusion-common = "55"
# The OpenLineage / DataFusion integration lives in its own repo
# (datafusion-contrib/datafusion-openlineage), published to crates.io as
# `datafusion-openlineage`. Consumers import it as `datafusion_openlineage`.
# Pinned to the v0.0.11 release tag's commit (DataFusion 55) until the crates.io
# mirror has it; then drop `git`/`rev` and keep the `version`.
datafusion-openlineage = { version = "0.0.11", git = "https://github.com/datafusion-contrib/datafusion-openlineage", rev = "0178e846243e0c353b62bed566e4b85458b21ec4" }
datafusion-tracing = "55"
# The published `buoyant_kernel` (the Buoyant Data distribution of
# delta-kernel-rs), the same one deltalake-core and mangrove resolve, so the
# whole graph shares one kernel and hydrofoil (which uses these types directly)
# agrees with delta-rs on the Engine/Field kernel API. `arrow-59` keeps it on
# datafusion 55's arrow major.
delta_kernel = { package = "buoyant_kernel", version = "0.28.1", features = [
    "internal-api",
    "arrow-conversion",
    "arrow-59",
] }
futures = "0.3.32"
itertools = "0.14"
object_store = { version = "0.13.2", features = ["azure", "aws", "gcp"] }
olai-http = { version = "0.0.5" }
ordered-float = { version = "5" }
prost = { version = "0.14.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sqlparser = { version = "0.62", default-features = false, features = [
    "std",
    "visitor",
] }
thiserror = { version = "2" }
tokio = { version = "1.47", features = ["macros", "rt", "sync"] }
tonic = "0.14.1"
tonic-prost = "0.14.3"
tonic-tracing-opentelemetry = "0.32.0"
tracing = { version = "0.1", features = ["log"] }
url = { version = "2.5.2", features = [
    "serde",
    "std",
], default-features = false }
uuid = { version = "1", features = ["v4"] }

# delta-rs / Unity Catalog, pinned to pushed git revs so the workspace (and the
# Docker build, whose context is just this repo) resolves them without sibling
# checkouts. Keep both revs in lock-step with mangrove's workspace `Cargo.toml`.
#
# The UC crates live in open-lakehouse/mangrove, published as `olai-uc-*`. The
# in-tree dep keys stay `unitycatalog-*` / `datafusion-unitycatalog` via the
# `package =` alias so dependents' `{ workspace = true }` references are unchanged.
# They all stay on git: `olai-uc-datafusion` can't publish while it depends on
# the deltalake-core git rev, and mixing a crates.io `olai-uc-common` with its
# git copy would split the UC types.
#
# deltalake-core is the roeap/delta-rs `olai/catalog-managed` branch: upstream
# `main` @807b9c03 (2.0.0-dev, the catalog-managed read path) plus one commit
# exporting `to_delta_predicate` — the same rev mangrove pins.
unitycatalog-common = { package = "olai-uc-common", git = "https://github.com/open-lakehouse/mangrove", rev = "679634fd5b5f3697b0fe05e7f9ab27e75b4448ce", features = ["rest-client", "axum"] }
unitycatalog-client = { package = "olai-uc-client", git = "https://github.com/open-lakehouse/mangrove", rev = "679634fd5b5f3697b0fe05e7f9ab27e75b4448ce" }
unitycatalog-object-store = { package = "olai-uc-object-store", git = "https://github.com/open-lakehouse/mangrove", rev = "679634fd5b5f3697b0fe05e7f9ab27e75b4448ce" }
unitycatalog-delta-api = { package = "olai-uc-delta-api", git = "https://github.com/open-lakehouse/mangrove", rev = "679634fd5b5f3697b0fe05e7f9ab27e75b4448ce", default-features = false }
datafusion-unitycatalog = { package = "olai-uc-datafusion", git = "https://github.com/open-lakehouse/mangrove", rev = "679634fd5b5f3697b0fe05e7f9ab27e75b4448ce" }
deltalake-core = { version = "2.0.0", git = "https://github.com/roeap/delta-rs", rev = "4b2af2d34409649ccf762312160405acdeaafea0", features = ["datafusion", "cloud"] }
