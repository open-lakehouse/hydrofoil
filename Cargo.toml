[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
arrow = "60"
arrow-array = { version = "60" }
arrow-flight = { version = "60", features = ["flight-sql"] }
arrow-schema = { version = "60" }
arrow-select = { version = "60" }
async-trait = { version = "^0.1.89" }
bytes = { version = "1" }
# The Cedar/policy crates live in the breakwater sibling repo
# (open-lakehouse/breakwater), published to crates.io. Consumers import them as
# `cedar_oci` / `datafusion_policy_cedar` (names unchanged from the in-tree crates).
# `datafusion-policy` is the neutral (engine-agnostic) core: it owns the
# secured-view provider seam (`govern_provider_from_config`) hydrofoil wraps
# UC-resolved tables with, imported as `datafusion_policy`.
cedar-oci = { package = "olai-cedar-oci", version = "0.0.3" }
datafusion-policy = { package = "olai-datafusion-policy", version = "0.0.5" }
datafusion-policy-cedar = { package = "olai-datafusion-policy-cedar", version = "0.0.5" }
chrono = { version = "0.4.44", features = ["serde"] }
config = "0.15.19"
dashmap = "6.0.1"
datafusion = "56"
datafusion-common = "56"
# The OpenLineage / DataFusion integration lives in its own repo
# (datafusion-contrib/datafusion-openlineage), published to crates.io as
# `datafusion-openlineage`. Consumers import it as `datafusion_openlineage`.
datafusion-openlineage = "0.0.13"
datafusion-tracing = "56"
# The published `buoyant_kernel` (the Buoyant Data distribution of
# delta-kernel-rs), the same one deltalake-core and mangrove resolve, so the
# whole graph shares one kernel and hydrofoil (which uses these types directly)
# agrees with delta-rs on the Engine/Field kernel API. `arrow-60` keeps it on
# datafusion 56's arrow major.
delta_kernel = { package = "buoyant_kernel", version = "0.30.1", default-features = false, features = [
    "internal-api",
    "arrow-conversion",
    "default-engine-base",
    "arrow-60",
] }
# The default engine (`DefaultEngineBuilder`), split out of the kernel crate; the
# managed-table commit path in `datafusion-unitycatalog` builds one.
delta_kernel_default_engine = { package = "buoyant_kernel_engine", version = "0.30.1", default-features = false, features = [
    "arrow-60",
    "rustls",
] }
futures = "0.3.32"
itertools = "0.14"
object_store = { version = "0.14.2", features = ["azure", "aws", "gcp"] }
olai-http = { version = "0.0.14" }
ordered-float = { version = "5" }
prost = { version = "0.14.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sqlparser = { version = "0.63", default-features = false, features = [
    "std",
    "visitor",
] }
thiserror = { version = "2" }
tokio = { version = "1.47", features = ["macros", "rt", "sync"] }
tonic = "0.14.1"
tonic-prost = "0.14.3"
tonic-tracing-opentelemetry = "0.32.0"
tracing = { version = "0.1", features = ["log"] }
url = { version = "2.5.2", features = [
    "serde",
    "std",
], default-features = false }
uuid = { version = "1", features = ["v4"] }

# The Unity Catalog crates live in open-lakehouse/mangrove, published to
# crates.io as `olai-uc-*`. The in-tree dep keys stay `unitycatalog-*` via the
# `package =` alias so dependents' `{ workspace = true }` references are unchanged.
unitycatalog-common = { package = "olai-uc-common", version = "0.0.13", features = ["rest-client", "axum"] }
unitycatalog-client = { package = "olai-uc-client", version = "0.0.15" }
unitycatalog-object-store = { package = "olai-uc-object-store", version = "0.0.15" }
unitycatalog-delta-api = { package = "olai-uc-delta-api", version = "0.0.11", default-features = false }
# The DataFusion catalog provider + Delta integration backed by Unity Catalog
# (moved here from mangrove, where it was `crates/datafusion`).
datafusion-unitycatalog = { package = "olai-uc-datafusion", path = "crates/datafusion-unitycatalog" }

# Shared with the UC crates: the buffa proto runtime the UC models are built on,
# and the trestle credential-vending crates the managed-table path uses.
buffa = { version = "0.7", features = ["json"] }
olai-storage-credentials = { version = "0.0.6" }
olai-vended-store = { version = "0.0.8", default-features = false }

# deltalake-core is the roeap/delta-rs `olai/kernel-executor-plans-df56` branch:
# upstream `main` @40439ad6 (2.0.0-dev on DataFusion 56 and buoyant_kernel 0.30),
# plus a commit re-exporting `to_delta_predicate` from
# `deltalake_core::delta_datafusion`, plus the kernel-executor plan operators
# (RelationSource / ScopedPlanExecutor, WriteJson, DynamicScan) and the fixes that
# let kernel's declarative metadata scan plan run (see
# docs/adr/0018-kernel-plan-executor-from-delta-rs.md). Pinned by rev so the
# workspace (and the Docker build, whose context is just this repo) resolves it
# without sibling checkouts. Switch to the crates.io release once 2.0 ships with
# these changes.
deltalake-core = { version = "2.0.0", git = "https://github.com/roeap/delta-rs", rev = "7a76c7ddf093ec376b3ee7ca8fc2652b33e58926", features = ["datafusion", "cloud"] }

# Local dev/test builds: line tables for workspace crates, so panics and
# backtraces keep file:line, and no debug info for dependencies, which is most of
# target/. Many parallel worktrees each carry a target/, so this matters on disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Full debug info for a debugger: `cargo build --profile debugging`
# (builds into target/debugging/, separate from the dev artifacts).
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true
